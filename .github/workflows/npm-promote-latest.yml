name: npm promote latest (one-shot)

# 一次性维护：把已确认的 0.1.7 线修订提升为 npm `latest`。
# CI 的 LATEST_LINE 规则已改为 v0.1.7，此后该线的新版本会自动进入 latest；
# 本工作流只负责把当前的 0.1.7-rc.1-v0.3 立即指过去。执行后删除本文件。
on:
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Point npm latest at the confirmed 0.1.7 revision
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm dist-tag add dsh-llm-newapi@0.1.7-rc.1-v0.3 latest
          sleep 5
          npm dist-tag ls dsh-llm-newapi
          curl -sS "https://registry.npmjs.org/dsh-llm-newapi" | node -e '
            let s = ""
            process.stdin.on("data", (d) => { s += d })
            process.stdin.on("end", () => {
              const j = JSON.parse(s)
              console.log("dist-tags:", JSON.stringify(j["dist-tags"]))
              for (const [v, meta] of Object.entries(j.versions)) {
                if (!meta.deprecated) console.log("active:", v)
              }
            })
          '
