name: npm undeprecate (one-shot)

# 一次性修复：当前 next 版本 0.1.7-rc.1-v0.1 被误标记为 deprecated
# （deprecate 应只覆盖 0.8.x 历史系列）。执行后删除本文件。
on:
  workflow_dispatch:

jobs:
  undeprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Clear the deprecation message on 0.1.7-rc.1-v0.1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm deprecate dsh-llm-newapi@0.1.7-rc.1-v0.1 ""
          sleep 5
          curl -sS "https://registry.npmjs.org/dsh-llm-newapi" | node -e '
            let s = ""
            process.stdin.on("data", (d) => { s += d })
            process.stdin.on("end", () => {
              const j = JSON.parse(s)
              for (const [v, meta] of Object.entries(j.versions)) {
                console.log(v.padEnd(20), meta.deprecated ? "DEPRECATED" : "(active)")
              }
              console.log("dist-tags:", JSON.stringify(j["dist-tags"]))
            })
          '
